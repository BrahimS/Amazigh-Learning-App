 rx="12" fill="#F8E1D6"/><text x="36" y="311" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#D66B3D" text-anchor="start">Traditions</text></g><text x="130.4" y="312" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5B6577" text-anchor="start">North Africa</text><text x="24" y="351" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#273447" text-anchor="start">Yennayer, the Amazigh</text><text x="24" y="390" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#273447" text-anchor="start">New Year</text><text x="24" y="441" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">Yennayer is the Amazigh New Year,</text><text x="24" y="465" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">celebrated around January 12–13.</text><text x="24" y="489" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">Families gather for a shared meal,</text><text x="24" y="513" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">and the day marks the return of light</text><text x="24" y="537" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">after the winter solstice.</text><text x="24" y="573" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">It is one of the most important</text><text x="24" y="597" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">festivals across Amazigh communities</text><text x="24" y="621" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">in North Africa.</text><g id="TabBar"><rect x="0" y="746" width="390" height="98" rx="0" fill="#FFFFFF"/><rect x="0" y="746" width="390" height="1" rx="0" fill="#E6DCCB"/><g id="Tab / Learn"><g id="icon/book" transform="translate(27 756) scale(1)" fill="none" stroke="#5B6577" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5M20 18v3H6.5"/></g><text x="39" y="798" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5B6577" text-anchor="middle">Learn</text></g><g id="Tab / Vocabulary"><g id="icon/cards" transform="translate(105 756) scale(1)" fill="none" stroke="#5B6577" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M7 3.5h11a2 2 0 0 1 2 2V17"/></g><text x="117" y="798" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5B6577" text-anchor="middle">Vocabulary</text></g><g id="Tab / Tifinagh"><text x="195" y="777" font-family="'Noto Sans Tifinagh', sans-serif" font-size="24" font-weight="400" fill="#5B6577" text-anchor="middle">ⵣ</text><text x="195" y="798" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5B6577" text-anchor="middle">Tifinagh</text></g><g id="Tab / Culture / active"><g id="icon/culture" transform="translate(261 756) scale(1)" fill="none" stroke="#176B55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10M19 21V10M9.5 21v-6h5v6M2 10l10-6.5L22 10z"/></g><text x="273" y="798" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#176B55" text-anchor="middle">Culture</text></g><g id="Tab / Profile"><g id="icon/person" transform="translate(339 756) scale(1)" fill="none" stroke="#5B6577" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g><text x="351" y="798" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5B6577" text-anchor="middle">Profile</text></g></g><rect x="128" y="831" width="134" height="5" rx="2.5" fill="#2