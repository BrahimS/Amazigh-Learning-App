<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800"><title>Article — Android medium</title><rect x="0" y="0" width="360" height="800" rx="0" fill="#F6F0E5"/><g id="StatusBar"><text x="16" y="22" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#273447" text-anchor="start">9:41</text><rect x="318" y="11" width="24" height="12" rx="3" fill="none" stroke="#273447" stroke-width="1.5"/><rect x="320" y="13" width="17" height="8" rx="1.5" fill="#273447"/><rect x="292" y="20" width="3" height="4" rx="1" fill="#273447"/><rect x="297" y="17" width="3" height="7" rx="1" fill="#273447"/><rect x="302" y="14" width="3" height="10" rx="1" fill="#273447"/><rect x="307" y="11" width="3" height="13" rx="1" fill="#273447"/></g><g id="Header"><rect x="6" y="36" width="44" height="44" rx="22" fill="none"/><g id="icon/back" transform="translate(16 46) scale(1)" fill="none" stroke="#273447" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></g></g><rect x="16" y="92" width="328" height="160" rx="24" fill="#DDEEE7"/><path id="motif/diamond-band" d="M60 160l12 12-12 12-12-12zM60 166.6l5.4 5.4-5.4 5.4-5.4-5.4zM84 160l12 12-12 12-12-12zM84 166.6l5.4 5.4-5.4 5.4-5.4-5.4zM108 160l12 12-12 12-12-12zM108 166.6l5.4 5.4-5.4 5.4-5.4-5.4zM132 160l12 12-12 12-12-12zM132 166.6l5.4 5.4-5.4 5.4-5.4-5.4zM156 160l12 12-12 12-12-12zM156 166.6l5.4 5.4-5.4 5.4-5.4-5.4zM180 160l12 12-12 12-12-12zM180 166.6l5.4 5.4-5.4 5.4-5.4-5.4zM204 160l12 12-12 12-12-12zM204 166.6l5.4 5.4-5.4 5.4-5.4-5.4zM228 160l12 12-12 12-12-12zM228 166.6l5.4 5.4-5.4 5.4-5.4-5.4zM252 160l12 12-12 12-12-12zM252 166.6l5.4 5.4-5.4 5.4-5.4-5.4zM276 160l12 12-12 12-12-12zM276 166.6l5.4 5.4-5.4 5.4-5.4-5.4zM300 160l12 12-12 12-12-12zM300 166.6l5.4 5.4-5.4 5.4-5.4-5.4z" fill="#176B55" fill-rule="evenodd" opacity="0.35"/><g id="Badge / Traditions"><rect x="16" y="276" width="98.4" height="24" rx="12" fill="#F8E1D6"/><text x="28" y="292" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#D66B3D" text-anchor="start">Traditions</text></g><text x="122.4" y="293" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5B6577" text-anchor="start">North Africa</text><text x="16" y="332" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#273447" text-anchor="start">Yennayer, the Amazigh</text><text x="16" y="371" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#273447" text-anchor="start">New Year</text><text x="16" y="422" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">Yennayer is the Amazigh New Year,</text><text x="16" y="446" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">celebrated around January 12–13.</text><text x="16" y="470" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">Families gather for a shared meal,</text><text x="16" y="494" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">and the day marks the return of</text><text x="16" y="518" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">light after the winter solstice.</text><text x="16" y="554" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">It is one of the most important</text><text x="16" y="578" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">festivals across Amazigh</text><text x="16" y="602" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#273447" text-anchor="start">communities in North Africa.</text><g id="TabBar"><rect x="0" y="720" width="360" height="80" rx="0" fill="#FFFFFF"/><rect x="0" y="720" width="360" height="1" rx="0" fill="#E6DCCB"/><g id="Tab / Learn"><g id="icon/book" transform